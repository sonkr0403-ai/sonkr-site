name: 블로그·유튜브 최신 글 갱신

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국 시간 오전 6시 17분
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    paths:
      - "scripts/update_feed.py"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 최신 글 읽기
        run: python3 scripts/update_feed.py
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feed.json
            git commit -m "블로그·유튜브 최신 글 자동 갱신"
            git push
          else
            echo "변경 없음"
          fi
